<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in Html</title>
</head>

<body>
    <legend>Registeration form In Html</legend>
    <fieldset>

        <form action="#" method="get">
            <label for="name">Name:</label>
            <input type="text" placeholder="Enter Your Name" required>
            <br> <br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Your Email" required>
            <br> <br>
            <label for="Contact">Contact No:</label>
            <input type="tel" placeholder="Enter Your Contact No" id="Contact" required>
            <br> <br>
            <label for="">DOB</label>
            <input type="date" placeholder="select DOB">
            <br> <br>
            <label for="Age">Age:</label>
            <input type="number" id="Age" placeholder="Enter Your Age">
            <br><br>
            <label for="ADD">Address:</label> <br>
            <textarea cols="30" rows="20" id="ADD"></textarea>
            <br><br>
            <label for="Gender"> Gender:</label>
            <input type="radio" id="Gender" Name="gender">Male
            <input type="radio" id="Gender" Name="gender">Female
            <input type="radio" id="Gender" Name="gender">Other
            <br><br>
            <label for="course"> Course:</label>
            <input type="checkbox" id="course">java
            <input type="checkbox" id="course">python
            <input type="checkbox" id="course">.net
            <input type="checkbox" id="course">software
            <br><br>
            <label for="">Branch</label>
            <select name="" id="">
            <option value="">select</option>
            <option value="">shivaji nager</option>
            <option value=""> banglore</option>
            <option value=""> hadapsar</option>
            <option value=""> PCMC</option>
            </select> <br> <br>
            <label for="">Sign</label> <br> <br>
            <input type="file" placeholder="upload your sign">

            <input type="submit" value="Register">


        </form>
    </fieldset>
</body>

</html>
