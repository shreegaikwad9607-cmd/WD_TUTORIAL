<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in Html</title>
</head>
<body>
    <header>
       <h1> Table in Html</h1>
    </header>
    <body>
        <table rules="all" border="2px" bgcolor="pink" cellpadding="10px">
            <tr>
                <th>Sr.no</th>
                <th>Name</th>
                <th>salary</th>
                <th>Companey</th>
            </tr>
            <tr>
            
                    <td>01</td>
                    <td>Amit</td>
                    <td>50k</td>
                    <td>TCS</td>
            
            </tr>
            <tr>
                <td>02</td>
                <td>Ved</td>
                <td>40k</td>
                <td>INFOCYS</td>


            </tr>
            <tr>
                <td>03</td>
                <td>pranv</td>
                <td>41k</td>
                <td>COG.</td>


            </tr>
        </table>
        <div>
            <!-- To add space between cells -->
             <!-- we have to remove Attribute rules="all" and then add Attribute cellspacing="20px" -->
             <table border="2px" bgcolor="pink" cellpadding="10px" cellspacing="20px">
            <tr>
                <th>Sr.no</th>
                <th>Name</th>
                <th>salary</th>
                <th>Companey</th>
            </tr>
            <tr>
            
                    <td>01</td>
                    <td>Amit</td>
                    <td>50k</td>
                    <td>TCS</td>
            
            </tr>
            <tr>
                <td>02</td>
                <td>Ved</td>
                <td>40k</td>
                <td>INFOCYS</td>


            </tr>
            <tr>
                <td>03</td>
                <td>pranv</td>
                <td>41k</td>
                <td>COG.</td>
                

            </tr>
        </table>
        </div>
    </body>
</body>
</html>
