<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flikart Header</title>
    <link rel="stylesheet" href="flipkart-nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <header>
        <div class="headbox">
            <div class="column1">
                <div class="box1">
                    <div class="head1">
                        <div class="logo">
                            <img class="logo1"
                                src="https://rukminim1.flixcart.com/fk-p-flap/52/44/image/d2ecfddf891a3922.png?q=60"
                                alt="flip">
                            <img class="logo2"
                                src="https://rukminim1.flixcart.com/fk-p-flap/92/36/image/31f7e3af490c225f.png?q=60"
                                alt="Flipkart">
                        </div>
                    </div>
                    <div class="head2">
                        <div class="traval">
                            <img class="travel-image"
                                src="https://rukminim1.flixcart.com/fk-p-flap/58/44/image/7ab4040af860941d.png?q=60"
                                alt="travelimage">
                            <img class="travel-font"
                                src="https://rukminim1.flixcart.com/fk-p-flap/72/36/image/5a9ff48eef96b876.png?q=60"
                                alt="TRAVEl">
                        </div>

                    </div>
                </div>
                <div class="box2">
                    <div class="location">
                        <i class="fa-solid fa-location-dot"></i>
                        <p>Location not set</p>
                    </div>
                    <div class="select">
                        <a href="">Select delivery location ></a>
                    </div>
                </div>

            </div>
            <div class="col2">
                <div class="box-1">
                    <div class="searchbox">
                        <form action="">
                               <i class="fa-solid fa-magnifying-glass"></i>
                               <input " type="text" placeholder="Search for Products,Brands and More">
                        </form>
                    </div>
                 
                    
                </div>
                <div class="box-2">
                    <div class="login">
                        <div class="loginlogo">
                            <i class="fa-regular fa-circle-user"></i>
                        </div>
                        <div class="text">
                            Login
                        </div>
                        <div class="arrow">
                            <i class="fa-solid fa-angle-down"></i>
                        </div>
                        <ul class=""></ul>
                    </div>
                    <div class="more">
                        <div class="text">More</div>
                        <div class="arrow"><i class="fa-solid fa-angle-down"></i></div>
                    </div>
                     <div class="cart">
                    <div class="cartlogo"><i class="fa-solid fa-cart-shopping"></i></div>
                    <div class="text">Cart</div>
                </div>
                </div>
               
            </div>
        </div>
    </header> <hr>
</body>

</html>
