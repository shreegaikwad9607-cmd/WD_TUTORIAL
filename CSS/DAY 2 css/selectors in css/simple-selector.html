<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector in html </title>
    <style>
        /* selector */
        /* 1.simple selectors */
        /*  id selector */
        #h44{
            color: yellow;
        }
        /* class selector */
        .c11{
            color: brown;

        }

        /* tagname selector */
        h2{
            font-family: cursive;
        }

        /* grouping selector  */
        #h444, .c11, h2{
            background-color: burlywood;
        }
        /* universal selector  */
        *{
            margin: 0;
            padding: 0;
        }
   





    </style>
</head>
<body>
    <h1 > Hello css</h1>
    <h3 class="c11">Hello Css 1</h3>
    <h2 class="c11">Hello css 2</h2>
    <h3 class="h44">Hello css 3</h3>
    <h4 class="c11">Hello css 4</h4>
</body>
</html>
