<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <section id="languages" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="html-5.png" alt="" height="25%" width="100%">
                <div class="carousel-caption">
                    <h1>Html</h1>
                </div>
            </div>
            <div class="carousel-item ">
                <img src="css.png" alt="" height="25%" width="100%">
                <div class="carousel-caption">
                    <h1>CSS</h1>
                </div>
            </div>
            <div class="carousel-item ">
                <img src="bootstrap-logo.png" alt="" height="25%" width="100%">
                <div class="carousel-caption">
                    <h1>BOOTSTRAP</h1>
                </div>
            </div>
            <button class="carousel-cantrol-prev" data-bs-slide="prev" data-bs-target="#languages">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-cantrol-next" data-bs-slide="next" data-bs-target="#languages">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>
</body>

</html>
